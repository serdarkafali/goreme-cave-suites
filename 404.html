<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sayfa bulunamadı · Göreme Cave Suites</title>
  <style>
    @font-face { font-family: 'Playfair Display'; src: local('Playfair Display') format('woff2'); font-display: swap; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
           background: #221A15; color: #F5EFE6; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    p.k { font-size: .7rem; letter-spacing: .32em; text-transform: uppercase; color: #D4AF37; margin: 0; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 18px 0 12px; }
    p.t { color: rgba(237, 227, 212, .75); max-width: 30rem; margin: 0 auto 32px; line-height: 1.6; font-weight: 300; }
    a { display: inline-block; padding: 14px 30px; border-radius: 999px; background: #D4AF37; color: #221A15;
        text-decoration: none; font-size: .72rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
    a:hover { background: #E6C974; }
  </style>
</head>
<body>
  <main>
    <p class="k">Göreme Cave Suites</p>
    <h1>Bu sayfa vadide kayboldu</h1>
    <p class="t">Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfadan devam edebilirsiniz.</p>
    <a id="home" href="/">Ana sayfaya dön</a>
  </main>
  <script>
    /* GitHub Pages proje adresinde (/goreme-cave-suites/) kök yerine proje klasörüne dön. */
    var m = location.pathname.match(/^\/goreme-cave-suites\//);
    if (m) document.getElementById('home').href = m[0];
  </script>
</body>
</html>
